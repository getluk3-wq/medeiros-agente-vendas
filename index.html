
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEDEIROS DIGITAL | Agente</title>
<style>
body{margin:0;background:#0c111b;color:#f4f5f7;font:15px Arial}.wrap{max-width:1000px;margin:auto;padding:22px}.panel,.stat{background:#182232;border:1px solid #2b3a50;border-radius:14px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.num{font-size:28px;font-weight:bold;margin-top:8px}input,textarea{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 14px;background:#0d1624;color:white;border:1px solid #40516a;border-radius:8px}button{padding:11px 16px;background:#d5ad68;border:0;border-radius:8px;font-weight:bold;margin:4px;cursor:pointer}.muted{color:#aab6c7}.hidden{display:none}.tabs{margin:16px 0}a{color:#e3bd7a}
</style></head><body><main class="wrap">
<div id="login" class="panel"><h2>MEDEIROS DIGITAL</h2><p class="muted">Painel do agente de vendas</p><label>Usuário</label><input id="user" value="rafael"><label>Senha</label><input id="pass" type="password"><button onclick="doLogin()">Entrar</button><p id="err"></p></div>
<div id="app" class="hidden"><h2>MEDEIROS DIGITAL <small class="muted">| AGENTE COMERCIAL</small></h2><button onclick="logout()">Sair</button><div id="stats" class="grid"></div>
<div class="tabs"><button onclick="show('home')">Início</button><button onclick="show('services')">Serviços</button><button onclick="show('products')">Produtos</button><button onclick="show('conversations')">Conversas</button><button onclick="show('settings')">Configurações</button></div>
<section id="home" class="panel"><h3>WhatsApp</h3><p id="wa">Aguardando estado...</p><button onclick="startWA()">Iniciar conexão</button><div id="qr"></div><p class="muted">A conexão exige WHATSAPP_ENABLED=true no ambiente do servidor.</p></section>
<section id="services" class="panel hidden"><h3>Cadastrar serviço</h3><input id="sn" placeholder="Nome do serviço"><input id="sp" type="number" step=".01" placeholder="Preço"><textarea id="sd" placeholder="Descrição"></textarea><button onclick="add('services')">Salvar serviço</button><div id="sl"></div></section>
<section id="products" class="panel hidden"><h3>Cadastrar produto/oferta</h3><input id="pn" placeholder="Nome do produto"><input id="pp" type="number" step=".01" placeholder="Preço"><input id="pu" placeholder="Link de afiliado/produto"><textarea id="pd" placeholder="Descrição"></textarea><button onclick="add('products')">Salvar produto</button><div id="pl"></div></section>
<section id="conversations" class="panel hidden"><h3>Conversas</h3><div id="cl"></div></section>
<section id="settings" class="panel hidden"><h3>Configurações comerciais</h3><label>Empresa</label><input id="business_name"><label>WhatsApp</label><input id="owner_whatsapp"><label>Mensagem inicial</label><textarea id="greeting"></textarea><label>Desconto máximo (%)</label><input id="discount_limit" type="number"><label><input id="ai_enabled" type="checkbox" style="width:auto"> Ativar IA (requer credenciais de provedor no servidor)</label><button onclick="saveSettings()">Salvar</button></section>
</div></main><script>
async function api(p,o={}){let r=await fetch('/api'+p,{headers:{'Content-Type':'application/json'},...o});let d=await r.json();if(!r.ok)throw Error(d.error||'Erro');return d}
async function doLogin(){try{await api('/login',{method:'POST',body:JSON.stringify({user:user.value,password:pass.value})});document.getElementById('login').classList.add('hidden');app.classList.remove('hidden');refresh()}catch(e){err.textContent='Usuário ou senha incorretos'}}
async function logout(){await api('/logout',{method:'POST'});location.reload()}
async function refresh(){let d=await api('/summary');stats.innerHTML=Object.entries({Clientes:d.contacts,Mensagens:d.messages,Serviços:d.services,Produtos:d.products}).map(([k,v])=>`<div class="stat"><span class="muted">${k}</span><div class="num">${v}</div></div>`).join('');wa.textContent='Estado: '+d.whatsapp.status;loadSettings()}
function show(id){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='services'||id==='products')loadCatalog(id);if(id==='conversations')loadConversations()}
async function startWA(){let d=await api('/whatsapp/start',{method:'POST'});wa.textContent='Estado: '+d.status;if(d.qr)qr.innerHTML='<img width="220" src="'+d.qr+'">'}
async function add(t){let p=t==='products',body=p?{name:pn.value,price:pp.value,url:pu.value,description:pd.value}:{name:sn.value,price:sp.value,description:sd.value};await api('/'+t,{method:'POST',body:JSON.stringify(body)});loadCatalog(t);refresh()}
async function loadCatalog(t){let a=await api('/'+t),el=document.getElementById(t==='products'?'pl':'sl');el.innerHTML=a.map(x=>`<p>${x.name} — R$ ${Number(x.price).toFixed(2)} ${x.url?'<a href="'+x.url+'" target="_blank">link</a>':''}</p>`).join('')||'<p class="muted">Ainda não há cadastros.</p>'}
async function loadConversations(){let a=await api('/conversations');cl.innerHTML=a.map(x=>`<p>${x.phone} — ${x.total} mensagens — ${x.last_message}</p>`).join('')||'Sem conversas ainda.'}
async function loadSettings(){let s=await api('/settings');for(let k of ['business_name','owner_whatsapp','greeting','discount_limit'])document.getElementById(k).value=s[k]||'';ai_enabled.checked=s.ai_enabled==='1'}
async function saveSettings(){let b={};for(let k of ['business_name','owner_whatsapp','greeting','discount_limit'])b[k]=document.getElementById(k).value;b.ai_enabled=ai_enabled.checked?'1':'0';await api('/settings',{method:'PUT',body:JSON.stringify(b)});alert('Configurações salvas')}
(async()=>{try{let x=await api('/me');if(x.loggedIn){login.classList.add('hidden');app.classList.remove('hidden');refresh()}}catch(e){}})();
</script></body></html>
